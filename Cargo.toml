[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/michaelrigart/tagteam"

[workspace.dependencies]
tagteam-core = { path = "crates/tagteam-core", version = "0.1.0" }
tagteam-provider = { path = "crates/tagteam-provider", version = "0.1.0" }
tagteam-cc = { path = "crates/tagteam-cc", version = "0.1.0" }
tagteam-engine = { path = "crates/tagteam-engine", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
fastrand = "2"
hex = "0.4"
libc = "0.2"
rpassword = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Blocking HTTP over rustls with the OS trust store (§4.4); no async runtime.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7"] }
# test-only
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
