[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "20261023.738.0"
edition = "2024"
# The minimum supported Rust: the newest dependencies set it (uuid 1.29 and rusqlite 0.41 declare 1.89).
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/michaelrigart/tagteam"
homepage = "https://github.com/michaelrigart/tagteam"
readme = "README.md"
keywords = ["claude", "claude-code", "accounts", "cli", "switcher"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
tagteam-core = { path = "crates/tagteam-core", version = "20261023.738.0" }
tagteam-provider = { path = "crates/tagteam-provider", version = "20261023.738.0" }
tagteam-cc = { path = "crates/tagteam-cc", version = "20261023.738.0" }
tagteam-engine = { path = "crates/tagteam-engine", version = "20261023.738.0" }
tagteam-daemon = { path = "crates/tagteam-daemon", version = "20261023.738.0" }
tagteam-tui = { path = "crates/tagteam-tui", version = "20261023.738.0" }
tagteam-fake = { path = "crates/tagteam-fake" }
# Export encryption (§13.3, Decision 10): scrypt passphrases, X25519 and ssh-ed25519 recipients,
# ASCII armor. The `ssh` feature pulls in `rsa` (RUSTSEC-2023-0071, a timing side channel in
# RSA decryption); tagteam never decrypts with an RSA key: `transfer::parse_identity_file`
# refuses one and `transfer::parse_recipient` refuses `ssh-rsa`, so the advisory does not apply.
# age's P-256 code pulls in crypto-bigint 0.5 (RUSTSEC-2026-0387, timing side channels); it serves
# only the `age1tag` and `age1tagpq` recipients, which age cannot decrypt in-process and
# `parse_recipient` refuses, so no P-256 arithmetic runs.
age = { version = "0.12", features = ["armor", "ssh"] }
clap = { version = "4", features = ["derive", "string"] }
# `tagteam completions` (§13.7): static scripts generated from the command definitions.
clap_complete = "4"
# The terminal UI (TUI spec §4.1): ratatui with its default crossterm backend, and the crossterm
# it is built against. Both are pinned exactly, so a patch release never changes what is drawn.
crossterm = "=0.29.0"
fastrand = "2"
hex = "0.4"
# The token report's days and months in a time zone, DST included (token report §3.1): the
# system zone database, nothing bundled. Pinned exactly, so a newer release is taken on purpose.
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
libc = "0.2"
# The TUI's input thread blocks on the terminal, SIGWINCH and a waker, with no wake-up while idle
# (TUI redesign spec §14, PERF-R-9): `Poll` and `Waker`, and `SourceFd` for the terminal's fd.
# crossterm waits with the same mio, so nothing new is built.
mio = { version = "1.2", features = ["os-poll", "os-ext"] }
ratatui = "=0.30.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.11"
# §14.1, Decision 2: SIGINT, SIGTERM and SIGHUP only set the cancel token; `flag` needs no
# feature.
signal-hook = { version = "0.4", default-features = false }
# SIGWINCH as a mio source, for the TUI input thread's wait (TUI redesign spec §14, PERF-R-9).
# crossterm registers its own the same way, through signal-hook 0.3 and signal-hook-mio 0.2: both
# versions are built, and their handlers chain through the one signal-hook-registry.
signal-hook-mio = { version = "0.3", features = ["support-v1_0"] }
thiserror = "2"
# config.toml (§6.4): read in M2b, written in M5; preserves comments and formatting.
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Blocking HTTP over rustls with the OS trust store (§4.4); no async runtime. Held to one
# minor: tagteam-engine wraps its transport, and `ureq::unversioned` breaks only in minors.
ureq = { version = "~3.5", default-features = false, features = ["rustls", "platform-verifier"] }
# NFC for Appendix A.2's Keychain names and §12.2's profile spelling. Claude Code names its items
# with its JavaScript runtime's NFC, and new Unicode tables can change NFC for code points they
# assign, so the tables move only on purpose: pinned exactly at Unicode 17 (0.1.26 has 18).
unicode-normalization = "=0.1.25"
# Display width of table cells: CJK and emoji take two columns.
unicode-width = "0.2"
uuid = { version = "1", features = ["v7"] }
# test-only
assert_cmd = "2"
predicates = "3"
# §11.5's simulations (tagteam-core), and the token report's transcript parser (tagteam-cc): std
# alone, without the fork and timeout features.
proptest = { version = "1.11", default-features = false, features = ["std"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"

# The profile that dist builds release binaries with
[profile.dist]
inherits = "release"
lto = "thin"
