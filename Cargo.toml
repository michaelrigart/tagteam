[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/michaelrigart/tagteam"
homepage = "https://github.com/michaelrigart/tagteam"

[workspace.dependencies]
tagteam-core = { path = "crates/tagteam-core", version = "0.1.0" }
tagteam-provider = { path = "crates/tagteam-provider", version = "0.1.0" }
tagteam-cc = { path = "crates/tagteam-cc", version = "0.1.0" }
tagteam-engine = { path = "crates/tagteam-engine", version = "0.1.0" }
tagteam-fake = { path = "crates/tagteam-fake" }
clap = { version = "4", features = ["derive", "string"] }
fastrand = "2"
hex = "0.4"
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
# §14.1, Decision 2: SIGINT, SIGTERM and SIGHUP only set the cancel token; `flag` needs no
# feature.
signal-hook = { version = "0.3", default-features = false }
thiserror = "2"
# config.toml (§6.4): read in M2b, written in M5; preserves comments and formatting.
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Blocking HTTP over rustls with the OS trust store (§4.4); no async runtime. Held to one
# minor: tagteam-engine wraps its transport, and `ureq::unversioned` breaks only in minors.
ureq = { version = "~3.4", default-features = false, features = ["rustls", "platform-verifier"] }
unicode-normalization = "0.1"
# Display width of table cells: CJK and emoji take two columns.
unicode-width = "0.2"
uuid = { version = "1", features = ["v7"] }
# test-only
assert_cmd = "2"
predicates = "3"
# §11.5's simulations (tagteam-core only): std alone, without the fork and timeout features.
proptest = { version = "1.11", default-features = false, features = ["std"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"

# The profile that dist builds release binaries with
[profile.dist]
inherits = "release"
lto = "thin"
