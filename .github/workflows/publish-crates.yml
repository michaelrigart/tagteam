name: Publish crates

# Called by release.yml (dist's `publish-jobs`) after the GitHub Release is hosted. Publishes
# the five crates to crates.io in dependency order. A crate whose version is already there is
# skipped, so a run that failed part-way can be re-run.
on:
  workflow_call:
    inputs:
      plan:
        description: dist's plan manifest (JSON)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJson(inputs.plan).announcement_tag }}
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # Wait up to 5 minutes, not cargo's 60 s, for each crate to reach the index before the
          # next one, which depends on it, is verified.
          CARGO_PUBLISH_TIMEOUT: "300"
        run: |
          set -euo pipefail
          VERSION=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "tagteam") | .version')
          test -n "$VERSION"
          echo "Publishing version $VERSION"
          for crate in tagteam-core tagteam-provider tagteam-cc tagteam-engine tagteam; do
            status=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' \
              -A 'michaelrigart/tagteam publish-crates workflow (https://github.com/michaelrigart/tagteam)' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            case $status in
              200)
                echo "$crate $VERSION is already on crates.io: skipping"
                ;;
              404)
                echo "Publishing $crate $VERSION"
                cargo publish -p "$crate" --locked
                ;;
              *)
                echo "::error::crates.io answered $status for $crate $VERSION (expected 200 or 404)"
                exit 1
                ;;
            esac
          done
