name: Publish crates

# Called by release.yml (dist's `publish-jobs`) after the GitHub Release is hosted. Publishes
# the six crates to crates.io in dependency order. A crate whose version is already there is
# skipped, so a run that failed part-way can be re-run.
#
# Authenticates with crates.io trusted publishing (GitHub OIDC): no stored secret. crates.io
# matches the token's workflow_ref claim, which names the top-level workflow (release.yml,
# which calls this file), so each crate's trusted publisher is registered for release.yml.
on:
  workflow_call:
    inputs:
      plan:
        description: dist's plan manifest (JSON)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJson(inputs.plan).announcement_tag }}
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Get a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          USER_AGENT: michaelrigart/tagteam publish-crates workflow (https://github.com/michaelrigart/tagteam)
        run: |
          set -euo pipefail
          # True once <crate> <version> is in the sparse index, where cargo resolves the next
          # crate's dependency on it.
          in_index() {
            curl -sS --retry 3 -A "$USER_AGENT" "https://index.crates.io/${1:0:2}/${1:2:2}/$1" \
              | jq -s -e --arg v "$2" 'any(.[]; .vers == $v)' >/dev/null 2>&1
          }
          VERSION=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "tagteam") | .version')
          test -n "$VERSION"
          echo "Publishing version $VERSION"
          for crate in tagteam-core tagteam-provider tagteam-cc tagteam-engine tagteam-daemon tagteam-tui tagteam; do
            status=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' -A "$USER_AGENT" \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            case $status in
              200)
                echo "$crate $VERSION is already on crates.io: skipping"
                ;;
              404)
                echo "Publishing $crate $VERSION"
                cargo publish -p "$crate" --locked
                ;;
              *)
                echo "::error::crates.io answered $status for $crate $VERSION (expected 200 or 404)"
                exit 1
                ;;
            esac
            # cargo's own wait for the index times out with only a warning (after 60 s in cargo
            # 1.88), so wait here, up to 5 minutes, before the next crate needs this one.
            deadline=$((SECONDS + 300))
            until in_index "$crate" "$VERSION"; do
              if (( SECONDS >= deadline )); then
                echo "::error::$crate $VERSION is not in the crates.io index after 5 minutes"
                exit 1
              fi
              sleep 10
            done
          done
