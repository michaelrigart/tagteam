name: Claude Code drift

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/cc-drift.yml
      - scripts/cc-drift.sh
      - scripts/cc-drift-test.sh
      - crates/tagteam-cc/compat/**

permissions:
  contents: read

concurrency:
  group: cc-drift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the drift script against fake claude builds
        run: scripts/cc-drift-test.sh
      - name: Install the latest Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          command -v claude
          claude --version
      - name: Run the account-free checks
        run: |
          rc=0
          scripts/cc-drift.sh --report "$RUNNER_TEMP/cc-drift-report.md" || rc=$?
          case "$rc" in
            0) echo "No drift." ;;
            1) echo "::notice::Drift found; see the job summary." ;;
            *)
              echo "::error::cc-drift.sh failed (exit $rc)"
              exit 1
              ;;
          esac
      - name: Write the job summary
        if: ${{ always() }}
        run: |
          {
            echo "## Claude Code drift (${RUNNER_OS})"
            echo
            if [ -s "$RUNNER_TEMP/cc-drift-report.md" ]; then
              cat "$RUNNER_TEMP/cc-drift-report.md"
            else
              echo "No drift."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stage the report
        if: ${{ always() }}
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          if [ -f "$RUNNER_TEMP/cc-drift-report.md" ]; then
            cp "$RUNNER_TEMP/cc-drift-report.md" "$RUNNER_TEMP/report/report.md"
          fi
          if [ -f "$RUNNER_TEMP/cc-drift-report.md.env-names.txt" ]; then
            cp "$RUNNER_TEMP/cc-drift-report.md.env-names.txt" "$RUNNER_TEMP/report/env-names.txt"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: cc-drift-${{ runner.os }}
          path: ${{ runner.temp }}/report/
          if-no-files-found: ignore

  report:
    name: report
    needs: check
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cc-drift-*
          path: reports
      - name: Compose the issue body
        id: compose
        run: |
          shopt -s nullglob
          body="Weekly check of the latest Claude Code against \`crates/tagteam-cc/compat/\` found drift."$'\n\n'
          found=0
          for f in reports/cc-drift-*/report.md; do
            [ -s "$f" ] || continue
            found=1
            os="${f#reports/cc-drift-}"
            os="${os%%/*}"
            body+="## ${os}"$'\n\n'"$(cat "$f")"$'\n\n'
          done
          if [ "$found" = 0 ]; then
            echo "No drift reported."
            echo "drift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fingerprint="$(printf '%s' "$body" | sha256sum | cut -d' ' -f1)"
          {
            printf '%s' "$body"
            echo "<!-- cc-drift-fingerprint: ${fingerprint} -->"
            echo
            echo "Run: ${RUN_URL}"
          } > issue-body.md
          {
            echo "drift=true"
            echo "fingerprint=${fingerprint}"
          } >> "$GITHUB_OUTPUT"
      - name: Open an issue, or comment when the report changed
        if: ${{ steps.compose.outputs.drift == 'true' }}
        env:
          FINGERPRINT: ${{ steps.compose.outputs.fingerprint }}
        run: |
          gh label create cc-drift --repo "$REPO" --force \
            --color D93F0B --description "Claude Code drift found by the weekly check"
          number="$(gh issue list --repo "$REPO" --label cc-drift --state open \
            --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            gh issue create --repo "$REPO" --label cc-drift \
              --title "Claude Code compatibility drift" --body-file issue-body.md
            exit 0
          fi
          seen="$(gh issue view "$number" --repo "$REPO" --json body,comments \
            --jq '[.body, (.comments[].body)] | join("\n")')"
          if printf '%s' "$seen" | grep -qF "cc-drift-fingerprint: ${FINGERPRINT}"; then
            echo "Issue #${number} already carries this report."
          else
            gh issue comment "$number" --repo "$REPO" --body-file issue-body.md
          fi
