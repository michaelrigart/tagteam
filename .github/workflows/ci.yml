name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name != 'schedule'
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (shipped shape)
        run: cargo clippy --workspace --locked -- -D warnings
      - name: Clippy (no features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (test-support)
        run: cargo clippy --workspace --all-targets --locked --features tagteam/test-support -- -D warnings
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast --features tagteam/test-support
      - name: Test (real keychain)
        if: runner.os == 'macOS'
        run: cargo test -p tagteam-provider --locked --features real_keychain --test real_keychain

  # No Swatinem/rust-cache here: a poisoned cache must not be able to make this job pass
  deny:
    name: deny (advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  # No Swatinem/rust-cache here, for the same reason as deny: a poisoned cache must not be able to
  # make this job pass
  feature-graph:
    name: feature graph (test-doubles)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: test-doubles is not in the normal-dependency graph
        run: |
          tree=$(cargo tree --workspace -e normal,features -i tagteam-provider --locked)
          printf '%s\n' "$tree"
          grep -q '^tagteam-provider ' <<<"$tree"
          if grep -F 'feature "test-doubles"' <<<"$tree"; then
            echo "::error::a normal dependency enables tagteam-provider's test-doubles feature"
            exit 1
          fi
