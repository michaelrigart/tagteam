[package]
name = "tagteam-engine"
description = "The tagteam store, vault and provider-generic operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Crash points for the kill tests (§15.2). Never enabled in release builds.
test-hooks = []
# §15.2's provenance sequence against a throwaway real keychain (macOS); gates
# tests/run_real_keychain.rs only.
real_keychain = []

[dependencies]
age.workspace = true
tagteam-core.workspace = true
tagteam-provider.workspace = true
fastrand.workspace = true
libc.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml_edit.workspace = true
tracing.workspace = true
ureq.workspace = true
uuid.workspace = true

[dev-dependencies]
tagteam-cc = { workspace = true, features = ["test-hooks"] }
tagteam-fake.workspace = true
tagteam-provider = { workspace = true, features = ["file-keychain", "mock-server"] }
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
