[package]
name = "tagteam-provider"
description = "Internal crate of tagteam: the Provider trait and the I/O primitives providers share. No stable API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# A directory-backed fake Keychain, for tests that drive the real binary.
file-keychain = []
# Tests against a temporary real keychain via /usr/bin/security (macOS CI).
real_keychain = []
# A local std::net HTTP server for adapter and cross-process tests. Never in release builds.
mock-server = []
# A record of every `FlockGuard::try_lock` (so `lock` too), for tests that prove a code path takes
# no lock. Never in release builds.
lock-log = []
# The in-memory doubles other crates' tests use: FakeClock, FakeKeychain, RecordedRequest,
# ScriptedHttp, FakeProcess, FakeProcessProbe, ScriptedSpawner. Only dev-dependencies may enable
# it: dist builds the whole workspace, so a feature a normal dependency enables ships.
test-doubles = []

[dependencies]
tagteam-core.workspace = true
fastrand.workspace = true
hex.workspace = true
libc.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
