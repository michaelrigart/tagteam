[package]
name = "tagteam"
description = "Multi-account switcher for AI coding agent CLIs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# Test support for driving the real binary: file-backed fake Keychain, crash points, and
# an injectable CC lock timeout.
test-support = ["tagteam-provider/file-keychain", "tagteam-provider/mock-server", "tagteam-engine/test-hooks", "tagteam-cc/test-hooks"]

[dependencies]
tagteam-core.workspace = true
tagteam-provider.workspace = true
tagteam-cc.workspace = true
tagteam-engine.workspace = true
clap.workspace = true
fastrand.workspace = true
libc.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-width.workspace = true

[dev-dependencies]
tagteam-fake.workspace = true
tagteam-provider = { workspace = true, features = ["file-keychain", "mock-server"] }
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true
