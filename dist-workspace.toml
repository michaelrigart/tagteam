[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "michaelrigart/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
# Which actions to run on pull requests
pr-run-mode = "upload"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "./publish-crates"]
# NOTICE is not auto-included (LICENSE is); both land in every archive
include = ["NOTICE"]
# Local artifacts jobs to run in CI after dist's own, before the release is hosted
global-artifacts-jobs = ["./release-smoke"]
# No Actions cache in release builds (spec H3)
cache-builds = false
# Attest the release artifacts when the release is hosted, which happens on tags only
github-attestations = true
github-attestations-phase = "host"

# Third-party actions pinned to commits: checkout v7.0.1, upload-artifact v7.0.1, download-artifact v8.0.1, attest v4.2.2
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"

# The publish-crates job checks out the tagged commit (contents) and gets a crates.io token
# through trusted publishing (id-token)
[dist.github-custom-job-permissions]
"publish-crates" = { contents = "read", id-token = "write" }
